<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>IM Clinic — мініатюра YouTube</title>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@500;600;700&family=Unbounded:wght@700&display=swap" rel="stylesheet">
<style>
/* Мініатюра 1280×720. Екран телефона — work/gfx/thumb-screen.png (рендерить make-thumbnail.mjs). */
:root{--signal:#1B4D9E;--night:#0A151D;--paper:#EAF2F2;--amber:#FFB65C;--ink:#14181A}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:720px;overflow:hidden;font-family:Geologica,Arial,sans-serif}
body{background:radial-gradient(900px 700px at 80% 15%,#16406a 0,var(--night) 62%);color:var(--paper);position:relative}
.l{position:absolute;left:72px;top:78px;width:690px}
.mark{display:flex;align-items:center;gap:16px;margin-bottom:34px}
.mark img{width:64px;height:64px}
.mark span{font-family:Unbounded,Geologica,sans-serif;font-size:28px;font-weight:700;letter-spacing:.01em}
h1{font-family:Unbounded,Geologica,sans-serif;font-size:76px;line-height:1.04;font-weight:700;letter-spacing:-.02em}
h1 em{font-style:normal;color:var(--amber)}
.tags{margin-top:40px;display:flex;gap:12px;flex-wrap:wrap}
.tags span{font-size:28px;font-weight:600;padding:10px 20px;border-radius:14px;background:rgba(234,242,242,.1);border:1px solid rgba(234,242,242,.2)}
.phone{position:absolute;right:120px;top:52px;width:330px;height:714px;border:12px solid #0d1419;border-radius:46px;overflow:hidden;
  transform:rotate(6deg);box-shadow:0 0 0 2px #2a333b,0 50px 90px -30px rgba(0,0,0,.7);background:#F4F6F6}
.phone img{width:100%;display:block}
.push{position:absolute;right:190px;top:500px;width:370px;display:flex;gap:14px;align-items:center;padding:16px 20px;border-radius:22px;
  background:#fff;color:var(--ink);box-shadow:0 30px 60px -20px rgba(0,0,0,.6);transform:rotate(-3deg)}
.push img{width:54px;height:54px;border-radius:14px;flex:none}
.push b{display:block;font-size:22px}
.push span{display:block;font-size:20px;color:#4E5C63;margin-top:2px}
</style>
</head>
<body>
<div class="l">
  <div class="mark"><img src="im-logo.svg" alt=""><span>IM Clinic</span></div>
  <h1>Застосунок для <em>ваших пацієнтів</em></h1>
  <div class="tags"><span>Запис</span><span>План лікування</span><span>Нагадування</span></div>
</div>
<div class="phone"><img src="../work/gfx/thumb-screen.png" alt=""></div>
<div class="push"><img src="app-logo.png" alt=""><div><b>Завтра візит о 10:30</b><span>Чекаємо на вас у клініці</span></div></div>
</body>
</html>
