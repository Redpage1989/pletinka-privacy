<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F4F6F6">
<title>IM Clinic — прототип кабінету пацієнта</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Токени — з кабінету пацієнта IM Clinic (PureApp globals.css, демо-бренд clinic-demo.im.pl.ua).
   Клініка налаштовує лише --signal; нейтральна шкала й --grease спільні для всіх. */
:root{
  --signal:#1B4D9E; --signal-d:#153d7e; --signal-soft:#E4EAF3;
  --ground:#F4F6F6; --panel:#fff; --sunk:#EBEFEF; --edge:#DFE5E6;
  --ink:#14181A; --read:#4E5C63; --dim:#5E6D74;
  --grease:#B23F26; --grease-soft:#FBE9E4; --ok:#1F7A4D;
  --shadow:0 1px 2px rgba(20,24,26,.05),0 8px 24px -16px rgba(20,24,26,.25);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Geologica,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:#dde3ea;
  display:flex;align-items:center;justify-content:center;gap:40px;padding:16px}
button,textarea{font:inherit;color:inherit;border:0;background:none}
button{cursor:pointer}
.tab{font-variant-numeric:tabular-nums}

/* Демо-панель (тільки для запису екрана на десктопі) */
.demo{width:230px;background:#fff;border-radius:16px;padding:16px;box-shadow:var(--shadow);font-size:14px}
.demo h2{font-size:15px;margin-bottom:4px}
.demo p{color:var(--read);font-size:12px;margin-bottom:12px;line-height:1.4}
.demo button{display:block;width:100%;padding:10px;margin-top:8px;border-radius:10px;background:var(--signal-soft);color:var(--signal);font-weight:600}
.demo button.ghost{background:var(--sunk);color:var(--read)}
.demo small{display:block;margin-top:12px;color:var(--dim);font-size:11px;line-height:1.4}

/* Телефон */
.phone{width:390px;height:800px;max-height:calc(100vh - 32px);background:var(--ground);border-radius:38px;
  border:10px solid #10161c;position:relative;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 18px 50px #0003}
.status{height:30px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-size:12px;font-weight:600;background:var(--panel)}
.app{flex:1;overflow-y:auto;padding-bottom:12px}
header.top{background:var(--panel);padding:10px 18px 12px;border-bottom:1px solid var(--edge)}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;flex:none;object-fit:cover}
header.top b{display:block;font-size:16px}
header.top span{font-size:12px;color:var(--dim)}
.demo-band{background:var(--signal-soft);color:var(--signal);font-size:11px;text-align:center;padding:4px}
.pad{padding:16px 18px}
h1{font-size:20px;font-weight:600;margin-bottom:4px;letter-spacing:-.01em}
h3{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:18px 0 8px}
.sub{color:var(--read);font-size:13px;margin-bottom:14px}
.card{background:var(--panel);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--signal-soft);color:var(--signal);display:grid;place-items:center;font-weight:600;flex:none}
.muted{color:var(--read);font-size:13px}
.btn{display:block;width:100%;background:var(--signal);color:#fff;padding:14px;border-radius:14px;font-weight:600;text-align:center;font-size:16px;min-height:48px}
.btn:disabled{background:#b5c2d6}
.btn.sec{background:var(--signal-soft);color:var(--signal)}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:3px 8px;border-radius:99px;background:var(--signal-soft);color:var(--signal)}
.pill.ok{background:#e1f2e8;color:var(--ok)}
.big{font-size:32px;font-weight:600;letter-spacing:-.02em;line-height:1.05;margin:6px 0}

.hero{background:var(--panel);border-radius:18px;padding:16px;margin-bottom:10px;box-shadow:var(--shadow);border-top:4px solid var(--signal)}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.quick button{background:var(--panel);border-radius:14px;padding:12px 6px;box-shadow:var(--shadow);font-size:12px;font-weight:600;min-height:72px;display:flex;flex-direction:column;align-items:center;gap:4px}
.quick span{font-size:22px}

/* Запис */
.doc{cursor:pointer;border:2px solid transparent;width:100%;text-align:left}
.doc.sel{border-color:var(--signal);background:var(--signal-soft)}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.day{flex:none;width:56px;padding:8px 0;border-radius:12px;background:var(--panel);text-align:center;border:2px solid transparent}
.day small{display:block;color:var(--dim);font-size:11px}
.day b{font-size:17px}
.day.sel,.slot.sel{border-color:var(--signal);background:var(--signal-soft);color:var(--signal)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.slot{padding:12px 0;border-radius:12px;background:var(--panel);text-align:center;font-weight:600;border:2px solid transparent;min-height:44px}
.steps{display:flex;gap:6px;margin-bottom:14px}
.steps i{flex:1;height:5px;border-radius:9px;background:var(--edge)}
.steps i.on{background:var(--signal)}
.back{color:var(--signal);font-weight:600;font-size:14px;margin-bottom:10px;min-height:32px}
.sum dt{color:var(--dim);font-size:12px;margin-top:10px}
.sum dd{font-weight:600}
textarea{width:100%;min-height:72px;margin-top:6px;padding:10px;border-radius:12px;background:var(--sunk);resize:vertical;font-size:14px}
.done{text-align:center;padding:30px 10px}
.check{width:72px;height:72px;border-radius:50%;background:var(--signal);color:#fff;font-size:38px;display:grid;place-items:center;margin:0 auto 14px;animation:pop .4s}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}

/* Лікування */
.money{display:flex;gap:18px;margin-top:10px}
.money div{flex:1}
.money b{display:block;font-size:17px}
.bar{height:8px;border-radius:9px;background:var(--sunk);overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;background:var(--signal);border-radius:9px}
.film{background:#0E1418;border-radius:14px;padding:12px 10px;color:#cfe;margin-bottom:10px}
.film p{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8aa;margin-bottom:8px}
.jaw{display:grid;grid-template-columns:repeat(16,1fr);gap:2px;margin-bottom:4px}
.t{aspect-ratio:3/4;border-radius:4px;border:1px solid #22303a;display:grid;place-items:center;font-size:8px;color:#8aa}
.t.d{background:#57C7B8;color:#0E1418;border-color:#57C7B8}
.t.p{border:1.5px dashed #FFB65C;color:#FFB65C}
.t.m{opacity:.25}
.legend{display:flex;gap:12px;font-size:11px;color:#9bb;margin-top:8px;flex-wrap:wrap}
.stage{display:flex;gap:10px;align-items:flex-start}
.stage .n{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--sunk);color:var(--read)}
.stage .n.d{background:var(--signal);color:#fff}
.stage .n.c{border:2px solid var(--signal);background:var(--panel);color:var(--signal)}
.price{margin-left:auto;font-weight:600;white-space:nowrap}
.warn{background:var(--grease-soft);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.warn b{color:var(--grease)}
.accepted{display:flex;align-items:center;gap:10px;padding:14px;border-radius:14px;background:#e1f2e8;color:var(--ok);font-weight:600}

/* Догляд */
.tl{position:relative;margin-left:8px;border-left:2px solid var(--edge);padding-left:16px}
.tl .item{position:relative;margin-bottom:10px}
.tl .item:before{content:"";position:absolute;left:-23px;top:16px;width:12px;height:12px;border-radius:50%;background:var(--edge);border:2px solid var(--ground)}
.tl .item.on:before{background:var(--signal)}
.tick{width:100%;text-align:left;display:flex;gap:10px;align-items:flex-start}
.box{width:24px;height:24px;border-radius:7px;border:2px solid var(--edge);flex:none;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px}
.tick.on .box{background:var(--signal);border-color:var(--signal)}
.tick.on .txt{color:var(--dim);text-decoration:line-through}
.urgent{border-left:4px solid var(--grease);background:var(--grease-soft)}
.urgent b{color:var(--grease)}
.urgent li{margin:4px 0 0 18px;font-size:14px}

nav.tabs{flex:none;display:flex;background:var(--panel);border-top:1px solid var(--edge);padding-bottom:6px}
nav.tabs button{flex:1;padding:9px 0 6px;font-size:11px;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:54px}
nav.tabs button span{font-size:20px}
nav.tabs button.on{color:var(--signal);font-weight:600}

/* Пуш-нагадування */
.push{position:absolute;left:10px;right:10px;top:-120px;background:#ffffffee;backdrop-filter:blur(8px);border-radius:18px;padding:12px;
  box-shadow:0 8px 30px #0003;transition:top .45s cubic-bezier(.16,1,.3,1);z-index:10;display:flex;gap:10px;cursor:pointer}
.push.show{top:38px}
.push .logo{width:38px;height:38px}
.push b{font-size:13px} .push p{font-size:13px;margin-top:2px;line-height:1.35}
.push small{color:var(--dim);font-size:11px;margin-left:auto;flex:none}

@media (max-width:760px){
  body{padding:0;display:block;background:var(--ground)}
  .demo{display:none}
  .phone{width:100%;height:100dvh;max-height:none;border:0;border-radius:0;box-shadow:none}
  .status{display:none}
  .push.show{top:10px}
}
</style>
</head>
<body>

<aside class="demo" aria-label="Демо-керування">
  <h2>Демо-режим</h2>
  <p>Прототип кабінету пацієнта IM Clinic для запису екрана. Дані вигадані. Панель не потрапляє в кадр, якщо записувати лише телефон.</p>
  <button id="d-push">🔔 Показати нагадування (N)</button>
  <button class="ghost" id="d-reset">↺ Скинути (R)</button>
  <small>Сценарій: Записатись → лікар → час → перевірка → Головна → нагадування → Лікування → Погодити план → Догляд.</small>
</aside>

<main class="phone" id="phone">
  <div class="status"><span>9:41</span><span>5G ▮▮▮</span></div>

  <div class="push" id="push" role="status" aria-live="polite">
    <img class="logo" src="logo.png" alt="">
    <div class="grow"><b id="push-title">IM Clinic</b><p id="push-text"></p></div>
    <small>зараз</small>
  </div>

  <div class="app" id="app"></div>

  <nav class="tabs" id="tabs" aria-label="Основна навігація">
    <button data-tab="home"><span>🏠</span>Головна</button>
    <button data-tab="plan"><span>📋</span>Лікування</button>
    <button data-tab="care"><span>🩹</span>Догляд</button>
    <button data-tab="clinic"><span>🏥</span>Клініка</button>
  </nav>
</main>

<script>
(function(){
  /* ДЕМО-ДАНІ — з демо-клініки IM Dental Demo (clinic-demo.im.pl.ua), усі вигадані. */
  var CLINIC={name:"IM Clinic",tagline:"Кабінет пацієнта",address:"м. Київ, просп. Демонстраційний, 1",phone:"+38 (044) 000 11 22"};
  var DOCTORS=[
    {id:1,name:"Литвиненко Марія",role:"Терапевт-стоматолог",ini:"МЛ"},
    {id:2,name:"Захарченко Олег",role:"Хірург-імплантолог",ini:"ОЗ"},
    {id:3,name:"Демчук Світлана",role:"Гігієніст",ini:"СД"}
  ];
  var BUSY={1:["10:00","12:30"],2:["09:00","11:30","15:00"],3:["10:30","14:00"]};
  var TIMES=["09:00","09:30","10:00","10:30","11:30","12:30","14:00","15:00","16:30"];
  var WD=["нд","пн","вт","ср","чт","пт","сб"];
  var MON=["січня","лютого","березня","квітня","травня","червня","липня","серпня","вересня","жовтня","листопада","грудня"];
  var STAGES=[
    {t:"Діагностика та санація",s:"Гігієна, видалення зубів 38 і 48",p:"9 800",st:"d"},
    {t:"Терапевтичне лікування",s:"Канал 26, пломби 16, 15, 46",p:"14 600",st:"c"},
    {t:"Хірургія / імплантація",s:"Імплант 36, нарощування кістки",p:"32 000",st:""},
    {t:"Протезування",s:"Коронки 26 і 36",p:"26 400",st:""}
  ];
  /* Зубна формула: d — проліковано, p — заплановано, m — немає */
  var TEETH={18:"m",28:"m",38:"m",48:"m",16:"d",26:"d",15:"p",46:"p",36:"p"};
  var UPPER=[18,17,16,15,14,13,12,11,21,22,23,24,25,26,27,28],LOWER=[48,47,46,45,44,43,42,41,31,32,33,34,35,36,37,38];
  var MEMO=[
    {w:"Одразу",x:"Тримати марлевий тампон 20–30 хвилин"},
    {w:"Через 2 години",x:"Можна їсти мʼяку теплу їжу, жувати іншим боком"},
    {w:"Перша доба",x:"Не полоскати рот і не пити через соломинку"},
    {w:"Наступного дня",x:"Обережно чистити зуби, оминаючи лунку"},
    {w:"Через тиждень",x:"Контрольний огляд у хірурга"}
  ];

  var S={tab:"home",step:1,doc:null,date:null,time:null,note:"",booked:null,accepted:null,memo:[true,true,false,false,false]};
  var app=document.getElementById("app");

  function load(){try{var v=JSON.parse(localStorage.getItem("im-clinic-proto")||"null");if(v){S.booked=v.booked||null;S.accepted=v.accepted||null;if(v.memo)S.memo=v.memo}}catch(e){}}
  function save(){try{localStorage.setItem("im-clinic-proto",JSON.stringify({booked:S.booked,accepted:S.accepted,memo:S.memo}))}catch(e){}}

  function days(){var a=[],n=new Date();for(var i=1;i<=10;i++){var d=new Date(n.getFullYear(),n.getMonth(),n.getDate()+i);if(d.getDay()!==0)a.push(d)}return a.slice(0,7)}
  function key(d){return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}
  function fmt(d){return WD[d.getDay()]+", "+d.getDate()+" "+MON[d.getMonth()]}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
  function docById(id){return DOCTORS.filter(function(x){return x.id===id})[0]}
  function dayByKey(k){return days().filter(function(d){return key(d)===k})[0]}
  function busy(docId,d,t){return (BUSY[docId]||[]).indexOf(t)>-1||((d.getDate()+docId)%3===0&&t==="14:00")}

  function head(){return '<header class="top"><div class="brand"><img class="logo" src="logo.png" alt="Логотип IM Clinic"><div><b>'+CLINIC.name+'</b><span>'+CLINIC.tagline+'</span></div></div></header><div class="demo-band">Демо: дані вигадані</div>'}

  function home(){
    var h=head()+'<div class="pad"><h1>Добрий день, Анно Сергіївно</h1><p class="sub">Візити, план лікування, догляд після процедур</p>';
    if(S.booked){
      var b=S.booked;
      h+='<div class="hero"><h3 style="margin-top:0">Найближчий візит</h3><div class="big tab">'+esc(b.dateText)+'<br>'+esc(b.time)+'</div><div class="muted">'+esc(b.doc)+' · '+esc(b.role)+'</div><p class="muted" style="margin-top:6px">Нагадаємо за добу й за 2 години</p></div>';
    } else {
      h+='<div class="hero"><h3 style="margin-top:0">Найближчий візит</h3><div class="big">Немає запису</div><div class="muted">Оберіть лікаря й вільний час</div><button class="btn" style="margin-top:12px" data-go="book">Записатись на прийом</button></div>';
    }
    h+='<div class="quick"><button data-go="plan"><span>📋</span>План</button><button data-go="book"><span>📅</span>Запис</button><button data-go="clinic"><span>📞</span>Подзвонити</button></div>';
    var done=S.memo.filter(Boolean).length;
    h+='<button class="card row" style="width:100%;text-align:left" data-go="care"><div class="avatar">🩹</div><div class="grow"><b>Памʼятка після видалення</b><div class="muted">Зуб 28 · виконано '+done+' з '+MEMO.length+' кроків</div></div><span>›</span></button>';
    h+='<div class="card row"><div class="avatar">🪥</div><div class="grow"><b>Час на профілактичний огляд</b><div class="muted">Минуло пів року від гігієни</div></div></div>';
    return h+'</div>';
  }

  function book(){
    var h=head()+'<div class="pad">';
    if(S.step===4){
      var b=S.booked;
      return h+'<div class="done"><div class="check">✓</div><h1>Ви записані</h1><p class="sub">'+esc(b.dateText)+', '+esc(b.time)+'<br>'+esc(b.doc)+'<br>Нагадаємо за добу й за 2 години</p><button class="btn" data-go="home">На головну</button></div></div>';
    }
    h+='<div class="steps"><i class="on"></i><i class="'+(S.step>=2?'on':'')+'"></i><i class="'+(S.step>=3?'on':'')+'"></i></div>';
    h+='<button class="back" data-back>← '+(S.step>1?'Назад':'На головну')+'</button>';
    if(S.step===1){
      h+='<h1>Оберіть лікаря</h1><p class="sub">Крок 1 з 3</p>';
      DOCTORS.forEach(function(d){
        h+='<button class="card doc row'+(S.doc===d.id?' sel':'')+'" data-doc="'+d.id+'"><div class="avatar">'+d.ini+'</div><div class="grow"><b>'+d.name+'</b><div class="muted">'+d.role+'</div></div></button>';
      });
      h+='<button class="btn" data-next '+(S.doc?'':'disabled')+'>Далі</button>';
    }
    if(S.step===2){
      h+='<h1>Вільний час</h1><p class="sub">Крок 2 з 3 · '+esc(docById(S.doc).name)+'</p><div class="days">';
      days().forEach(function(d){h+='<button class="day'+(S.date===key(d)?' sel':'')+'" data-date="'+key(d)+'"><small>'+WD[d.getDay()]+'</small><b>'+d.getDate()+'</b></button>'});
      h+='</div>';
      if(S.date){
        var dd=dayByKey(S.date);
        h+='<div class="slots">';
        TIMES.forEach(function(t){if(!busy(S.doc,dd,t))h+='<button class="slot tab'+(S.time===t?' sel':'')+'" data-time="'+t+'">'+t+'</button>'});
        h+='</div>';
      } else h+='<p class="muted" style="margin-bottom:14px">Оберіть день — покажемо лише справді вільний час</p>';
      h+='<button class="btn" data-next '+(S.date&&S.time?'':'disabled')+'>Далі</button>';
    }
    if(S.step===3){
      var doc=docById(S.doc);
      h+='<h1>Перевірте запис</h1><p class="sub">Крок 3 з 3</p><div class="card"><dl class="sum"><dt>Лікар</dt><dd>'+doc.name+' · '+doc.role+'</dd><dt>Дата й час</dt><dd class="tab">'+fmt(dayByKey(S.date))+', '+S.time+'</dd><dt>Адреса</dt><dd>'+CLINIC.address+'</dd></dl>';
      h+='<label class="muted" style="display:block;margin-top:12px" for="note">Що турбує (необовʼязково)</label><textarea id="note" placeholder="Наприклад: болить зуб знизу праворуч">'+esc(S.note)+'</textarea></div>';
      h+='<button class="btn" data-confirm>Підтвердити запис</button>';
    }
    return h+'</div>';
  }

  function plan(){
    var h=head()+'<div class="pad"><h1>План лікування</h1><p class="sub">Лікар: Литвиненко Марія · 4 етапи</p>';
    h+='<div class="card"><h3 style="margin-top:0">Лишилось сплатити</h3><div class="big tab">58 400 ₴</div><div class="bar"><i style="width:29%"></i></div><div class="money"><div><span class="muted">Сплачено</span><b class="tab">24 400 ₴</b></div><div><span class="muted">Етап</span><b>2 з 4</b></div></div></div>';
    h+='<div class="film"><p>Зубна формула</p>';
    [UPPER,LOWER].forEach(function(row){h+='<div class="jaw">';row.forEach(function(n){var s=TEETH[n]||"";h+='<div class="t '+s+'" title="Зуб '+n+'">'+n+'</div>'});h+='</div>'});
    h+='<div class="legend"><span>■ проліковано</span><span>┅ заплановано</span><span>▫ немає</span></div></div>';
    h+='<h3>Етапи</h3>';
    STAGES.forEach(function(s,i){
      h+='<div class="card stage"><div class="n '+s.st+'">'+(s.st==="d"?"✓":i+1)+'</div><div class="grow"><b>'+s.t+'</b><div class="muted">'+s.s+'</div>'+(s.st==="d"?'<span class="pill ok" style="margin-top:6px">Виконано</span>':s.st==="c"?'<span class="pill" style="margin-top:6px">Зараз</span>':'')+'</div><div class="price tab">'+s.p+' ₴</div></div>';
    });
    h+='<div class="warn"><b>Що буде, якщо чекати</b><p style="font-size:14px;margin-top:4px">Через півроку карієс під старими пломбами (15, 46) може дійти до нерва — тоді знадобиться лікування каналів: дорожче й довше.</p></div>';
    if(S.accepted) h+='<div class="accepted">✓ Ви погодили цей план · '+esc(S.accepted)+'</div>';
    else h+='<p class="muted" style="margin:6px 0 12px">Погодження нічого не списує: клініка побачить, що ви готові продовжувати, і запропонує наступний візит.</p><button class="btn" data-accept>Погодити план</button>';
    return h+'</div>';
  }

  function care(){
    var h=head()+'<div class="pad"><h1>Догляд</h1><p class="sub">Памʼятки, гарантії, огляди</p>';
    h+='<h3>Після видалення зуба 28</h3><div class="tl">';
    MEMO.forEach(function(m,i){h+='<div class="item card'+(S.memo[i]?' on':'')+'"><button class="tick'+(S.memo[i]?' on':'')+'" data-memo="'+i+'" aria-pressed="'+S.memo[i]+'"><span class="box">'+(S.memo[i]?'✓':'')+'</span><span class="grow"><span class="pill">'+m.w+'</span><span class="txt" style="display:block;margin-top:4px;font-size:14px">'+m.x+'</span></span></button></div>'});
    h+='</div><div class="card urgent"><b>⚠ Коли дзвонити терміново</b><ul><li>Кровотеча не зупиняється понад 2 години</li><li>Температура вище 38 °C</li><li>Набряк росте на третій день</li></ul><button class="btn sec" style="margin-top:12px" data-go="clinic">📞 Подзвонити в клініку</button></div>';
    h+='<h3>Гарантії</h3><div class="card row"><div class="avatar">🛡</div><div class="grow"><b>Пломба, зуб 16</b><div class="muted">Діє до березня 2027</div></div></div>';
    h+='<h3>Наступний огляд</h3><div class="card row"><div class="avatar">🪥</div><div class="grow"><b>Профілактичний огляд і гігієна</b><div class="muted">Рекомендовано раз на 6 місяців</div></div><button class="pill" data-go="book">Записатись</button></div>';
    return h+'</div>';
  }

  function clinic(){
    var h=head()+'<div class="pad"><h1>Клініка</h1><p class="sub"><span class="pill ok">● Відчинено</span> до 20:00</p>';
    h+='<div class="card"><dl class="sum"><dt>Адреса</dt><dd>'+CLINIC.address+'</dd><dt>Години</dt><dd>Пн–Пт 09:00–20:00 · Сб 10:00–16:00</dd><dt>Телефон</dt><dd class="tab">'+CLINIC.phone+'</dd></dl><a class="btn sec" style="margin-top:12px;text-decoration:none" href="tel:+380440001122">📞 Подзвонити</a></div>';
    h+='<h3>Лікарі</h3>';
    DOCTORS.forEach(function(d){h+='<div class="card row"><div class="avatar">'+d.ini+'</div><div class="grow"><b>'+d.name+'</b><div class="muted">'+d.role+'</div></div></div>'});
    return h+'<button class="btn" data-go="book">Записатись на прийом</button></div>';
  }

  var VIEWS={home:home,book:book,plan:plan,care:care,clinic:clinic};
  function render(){
    app.innerHTML=VIEWS[S.tab]();app.scrollTop=0;
    Array.prototype.forEach.call(document.querySelectorAll("#tabs button"),function(b){b.classList.toggle("on",b.dataset.tab===S.tab)});
  }
  function goTab(t){if(t==="book"&&(S.tab!=="book"||S.step===4))resetBook();S.tab=t;render()}
  function resetBook(){S.step=1;S.doc=null;S.date=null;S.time=null;S.note=""}

  document.getElementById("tabs").addEventListener("click",function(e){var b=e.target.closest("button");if(b)goTab(b.dataset.tab)});
  app.addEventListener("input",function(e){if(e.target.id==="note")S.note=e.target.value});
  app.addEventListener("click",function(e){
    var t=e.target.closest("button");if(!t||t.disabled)return;
    if(t.dataset.go){goTab(t.dataset.go);return}
    if(t.dataset.doc){S.doc=+t.dataset.doc;render();return}
    if(t.dataset.date){S.date=t.dataset.date;S.time=null;render();return}
    if(t.dataset.time){S.time=t.dataset.time;render();return}
    if(t.dataset.memo){var i=+t.dataset.memo;S.memo[i]=!S.memo[i];save();var y=app.scrollTop;render();app.scrollTop=y;return}
    if("next" in t.dataset){S.step++;render();return}
    if("back" in t.dataset){if(S.step>1){S.step--;render()}else goTab("home");return}
    if("accept" in t.dataset){S.accepted=fmt(new Date());save();var y2=app.scrollTop;render();app.scrollTop=y2;return}
    if("confirm" in t.dataset){
      var doc=docById(S.doc);
      S.booked={doc:doc.name,role:doc.role,time:S.time,dateText:fmt(dayByKey(S.date))};save();S.step=4;render();
    }
  });

  /* Тексти пушів — як у застосунку: без медичних даних, бо їх видно на заблокованому екрані. */
  var pushEl=document.getElementById("push"),pushTimer;
  function showPush(){
    var b=S.booked;
    document.getElementById("push-title").textContent=b?"Завтра візит":"Час на профілактичний огляд";
    document.getElementById("push-text").textContent=b?"Чекаємо на вас завтра о "+b.time+". Якщо плани змінились — скасуйте чи перенесіть у застосунку.":"Минуло пів року від гігієни — запишіться в застосунку.";
    pushEl.classList.add("show");clearTimeout(pushTimer);pushTimer=setTimeout(function(){pushEl.classList.remove("show")},4500);
  }
  function resetAll(){S.booked=null;S.accepted=null;S.memo=[true,true,false,false,false];resetBook();S.tab="home";try{localStorage.removeItem("im-clinic-proto")}catch(e){}pushEl.classList.remove("show");render()}
  document.getElementById("d-push").onclick=showPush;
  document.getElementById("d-reset").onclick=resetAll;
  pushEl.onclick=function(){pushEl.classList.remove("show");goTab(S.booked?"home":"book")};
  document.addEventListener("keydown",function(e){if(e.target.tagName==="TEXTAREA"||e.target.tagName==="INPUT")return;if(e.key==="n"||e.key==="N")showPush();if(e.key==="r"||e.key==="R")resetAll()});

  load();render();
})();
</script>
</body>
</html>
