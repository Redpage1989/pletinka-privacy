<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F4F6F6">
<title>IM Clinic — прототип кабінету пацієнта</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Токени й тексти — з кабінету пацієнта IM Clinic (PureApp globals.css; живе демо clinic-demo.im.pl.ua, звірено 06.10.2026).
   Клініка налаштовує лише --signal; нейтральна шкала й --grease спільні для всіх. */
:root{
  --signal:#1B4D9E; --signal-soft:#E4EAF3;
  --ground:#F4F6F6; --panel:#fff; --sunk:#EBEFEF; --edge:#DFE5E6;
  --ink:#14181A; --read:#4E5C63; --dim:#5E6D74;
  --grease:#B23F26; --grease-soft:#FBE9E4; --ok:#1F7A4D;
  --shadow:0 1px 2px rgba(20,24,26,.05),0 8px 24px -16px rgba(20,24,26,.25);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Geologica,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:#dde3ea;
  display:flex;align-items:center;justify-content:center;gap:40px;padding:16px}
button,textarea{font:inherit;color:inherit;border:0;background:none}
button{cursor:pointer}
.tab{font-variant-numeric:tabular-nums}

/* Демо-панель (тільки для запису екрана на десктопі) */
.demo{width:230px;background:#fff;border-radius:16px;padding:16px;box-shadow:var(--shadow);font-size:14px}
.demo h2{font-size:15px;margin-bottom:4px}
.demo p{color:var(--read);font-size:12px;margin-bottom:12px;line-height:1.4}
.demo button{display:block;width:100%;padding:10px;margin-top:8px;border-radius:10px;background:var(--signal-soft);color:var(--signal);font-weight:600}
.demo button.ghost{background:var(--sunk);color:var(--read)}
.demo small{display:block;margin-top:12px;color:var(--dim);font-size:11px;line-height:1.4}

/* Телефон */
.phone{width:390px;height:800px;max-height:calc(100vh - 32px);background:var(--ground);border-radius:38px;
  border:10px solid #10161c;position:relative;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 18px 50px #0003}
.status{height:30px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-size:12px;font-weight:600;background:var(--panel)}
.app{flex:1;overflow-y:auto;padding-bottom:12px}
header.top{background:var(--panel);padding:10px 18px;border-bottom:1px solid var(--edge);display:flex;align-items:center;gap:10px}
.logo{width:30px;height:30px;border-radius:8px;flex:none;object-fit:cover}
header.top b{display:block;font-size:14px;font-weight:600}
header.top span{display:block;font-size:11px;color:var(--dim)}
.demo-band{background:var(--signal-soft);color:var(--signal);font-size:11px;text-align:center;padding:4px}
.pad{padding:16px 18px}
h1{font-size:20px;font-weight:600;margin-bottom:4px;letter-spacing:-.01em}
h3{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:18px 0 8px}
.sub{color:var(--read);font-size:13px;margin-bottom:14px}
.card{background:var(--panel);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--signal-soft);color:var(--signal);display:grid;place-items:center;font-weight:600;flex:none}
.muted{color:var(--read);font-size:13px}
.btn{display:block;width:100%;background:var(--signal);color:#fff;padding:14px;border-radius:14px;font-weight:600;text-align:center;font-size:16px;min-height:48px;text-decoration:none}
.btn.sec{background:var(--signal-soft);color:var(--signal)}
.link{display:block;margin:10px auto 0;color:var(--signal);font-size:14px;min-height:32px}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:3px 8px;border-radius:99px;background:var(--signal-soft);color:var(--signal)}
.pill.ok{background:#e1f2e8;color:var(--ok)}
.big{font-size:34px;font-weight:600;letter-spacing:-.02em;line-height:1.05}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--edge);font-size:14px}
.kv span:first-child{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);padding-top:2px}
.kv span:last-child{text-align:right;font-weight:500}
.chev{color:var(--dim);font-size:20px}

.quick{width:100%;text-align:left;text-decoration:none;color:inherit}

/* Запис */
.doc{width:100%;text-align:left}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:6px}
.slot{padding:10px 0;border-radius:10px;background:var(--panel);text-align:center;font-weight:500;border:1px solid var(--edge);min-height:44px}
textarea{width:100%;min-height:72px;margin:6px 0 14px;padding:10px;border-radius:12px;background:var(--panel);border:1px solid var(--edge);resize:vertical;font-size:14px}
.done{text-align:center;padding:30px 10px}
.check{width:72px;height:72px;border-radius:50%;background:var(--signal);color:#fff;font-size:38px;display:grid;place-items:center;margin:0 auto 14px;animation:pop .4s}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}

/* Лікування */
.segbar{display:flex;gap:3px;margin:12px 0 4px}
.segbar i{flex:1;height:10px;border-radius:2px;background:var(--sunk)}
.segbar i.on{background:var(--signal)}
.film{background:#0E1418;border-radius:14px;padding:12px 10px;color:#cfe;margin-bottom:10px}
.jaw{display:grid;grid-template-columns:repeat(16,1fr);gap:2px;margin-bottom:4px}
.t{aspect-ratio:3/4;border-radius:4px;border:1px solid #22303a;display:grid;place-items:center;font-size:8px;color:#8aa}
.t.d{background:#57C7B8;color:#0E1418;border-color:#57C7B8}
.t.p{border:1.5px dashed #FFB65C;color:#FFB65C}
.t.m{opacity:.25}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:12px;margin-top:10px}
.legend span{display:flex;justify-content:space-between;color:var(--read)}
.stage{display:flex;gap:10px;align-items:flex-start}
.stage .n{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--sunk);color:var(--read)}
.stage .n.d{background:var(--signal);color:#fff}
.stage .n.c{border:2px solid var(--signal);background:var(--panel);color:var(--signal)}
.price{margin-left:auto;font-weight:600;white-space:nowrap}
.warn{background:var(--grease-soft);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.warn b{color:var(--grease)}
.warn p{font-size:14px;margin-top:6px}
.accepted{display:flex;align-items:center;gap:10px;padding:14px;border-radius:14px;background:#e1f2e8;color:var(--ok);font-weight:600}

/* Догляд */
.seg{display:flex;background:var(--sunk);border-radius:12px;padding:3px;margin-bottom:14px}
.seg button{flex:1;padding:8px 0;border-radius:10px;font-size:13px;color:var(--read);min-height:36px}
.seg button.on{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.tl{position:relative;margin-left:8px;border-left:2px solid var(--edge);padding-left:16px}
.tl .item{position:relative;margin-bottom:10px}
.tl .item:before{content:"";position:absolute;left:-23px;top:16px;width:12px;height:12px;border-radius:50%;background:var(--edge);border:2px solid var(--ground)}
.tl .item.on:before{background:var(--signal)}
.tick{width:100%;text-align:left;display:flex;gap:10px;align-items:flex-start}
.box{width:24px;height:24px;border-radius:7px;border:2px solid var(--edge);flex:none;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px}
.tick.on .box{background:var(--signal);border-color:var(--signal)}
.tick.on .txt{color:var(--dim)}
.urgent{border-left:4px solid var(--grease);background:var(--grease-soft)}
.urgent b{color:var(--grease)}
.urgent li{margin:6px 0 0 18px;font-size:14px}

nav.tabs{flex:none;display:flex;background:var(--panel);border-top:1px solid var(--edge);padding-bottom:6px}
nav.tabs button{flex:1;padding:9px 0 6px;font-size:11px;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:54px}
nav.tabs button span{font-size:19px;height:24px;line-height:24px}
nav.tabs button.on{color:var(--signal);font-weight:600}

/* Пуш-нагадування */
.push{position:absolute;left:10px;right:10px;top:-120px;background:#ffffffee;backdrop-filter:blur(8px);border-radius:18px;padding:12px;
  box-shadow:0 8px 30px #0003;transition:top .45s cubic-bezier(.16,1,.3,1);z-index:10;display:flex;gap:10px;cursor:pointer}
.push.show{top:38px}
.push .logo{width:38px;height:38px}
.push b{font-size:13px} .push p{font-size:13px;margin-top:2px;line-height:1.35}
.push small{color:var(--dim);font-size:11px;margin-left:auto;flex:none}

@media (max-width:760px){
  body{padding:0;display:block;background:var(--ground)}
  .demo{display:none}
  .phone{width:100%;height:100dvh;max-height:none;border:0;border-radius:0;box-shadow:none}
  .status{display:none}
  .push.show{top:10px}
}
/* Запис екрана (index.html#rec): повноекранний телефон у 2×, вʼюпорт 780×1688 → чіткий кадр для відео */
html.rec{zoom:2}
.rec body{padding:0;display:block;background:var(--ground)}
.rec .demo,.rec .status,.rec .demo-band{display:none} /* плашка «Демо» — лише в живому прототипі, не у відео */
.rec .phone{width:100%;height:50dvh;max-height:none;border:0;border-radius:0;box-shadow:none}
.rec .push.show{top:10px}
</style>
</head>
<body>

<aside class="demo" aria-label="Демо-керування">
  <h2>Демо-режим</h2>
  <p>Прототип кабінету пацієнта IM Clinic для запису екрана. Дані з демо-клініки, вигадані. Панель не потрапляє в кадр, якщо записувати лише телефон.</p>
  <button id="d-push">🔔 Показати нагадування (N)</button>
  <button class="ghost" id="d-reset">↺ Скинути (R)</button>
  <small>Сценарій: Записатися → лікар → час → перевірка → Головна → нагадування → Догляд → Лікування → Погодити план.</small>
</aside>

<main class="phone" id="phone">
  <div class="status"><span>9:41</span><span>5G ▮▮▮</span></div>

  <div class="push" id="push" role="status" aria-live="polite">
    <img class="logo" src="logo.png" alt="">
    <div class="grow"><b id="push-title">Demo IM Clinic</b><p id="push-text"></p></div>
    <small>зараз</small>
  </div>

  <div class="app" id="app"></div>

  <nav class="tabs" id="tabs" aria-label="Основна навігація">
    <button data-tab="home"><span>⌂</span>Головна</button>
    <button data-tab="plan"><span>▤</span>Лікування</button>
    <button data-tab="care"><span>♡</span>Догляд</button>
    <button data-tab="clinic"><span>⌖</span>Клініка</button>
    <button data-tab="profile"><span>◯</span>Профіль</button>
  </nav>
</main>

<script>
(function(){
  /* ДЕМО-ДАНІ — з демо-клініки IM Dental Demo (clinic-demo.im.pl.ua), усі вигадані. */
  var CLINIC={app:"Demo IM Clinic",name:"IM Dental Demo",address:"м. Київ, просп. Демонстраційний, 1",phone:"+38 (044) 000 11 22",tel:"+380440001122"};
  var DOCTORS=[
    {id:1,name:"Гриценко Оксана Миколаївна",role:"Терапевт-стоматолог"},
    {id:2,name:"Демченко Ірина Валеріївна",role:"Гігієніст"},
    {id:3,name:"Радченко Павло Юрійович",role:"Хірург-імплантолог"},
    {id:4,name:"Савчук Роман Олегович",role:"Ортопед"}
  ];
  var TIMES=["09:00","09:30","10:00","10:30","11:00","11:30","12:00","12:30","14:00","14:30","15:00","15:30","16:00","16:30","17:00","17:30"];
  var MON=["січня","лютого","березня","квітня","травня","червня","липня","серпня","вересня","жовтня","листопада","грудня"];
  var STAGES=[
    {t:"Діагностика та санація",v:"3 візити",p:"6 600",c:"3 з 3",st:"d"},
    {t:"Терапевтичне лікування",v:"4 візити",p:"5 000",c:"2 з 4",st:"c",
     why:"Тут рятуємо ваші власні зуби. Канал у зубі 26 пролікували, поки запалення не пішло далі. У зубах 15 і 46 під старими пломбами знову карієс — поставимо нові пломби, поки не дійшло до нерва.",
     res:"Живі зуби збережені й загерметизовані."},
    {t:"Хірургія / імплантація",v:"1–2 візити + 3–6 міс. приживлення",p:"21 750",c:"0 з 2",st:""},
    {t:"Протезування",v:"2 візити",p:"16 300",c:"0 з 2",st:""}
  ];
  var WARNINGS=[
    ["Через півроку","Вторинний карієс під старими пломбами (15, 46) дійде до нерва — і зуб уже потребуватиме лікування каналів: дорожче і довше."],
    ["Через кілька місяців","Зуб 26 після лікування каналів без коронки лишається крихким і може тріснути під звичайним навантаженням."],
    ["Через рік","Без імпланта на місці зуба 36 щелепа поступово втрачає кістку, сусідні зуби нахиляються в порожнечу."]
  ];
  /* Зубна формула: d — проліковано, p — заплановано, m — відсутній */
  var TEETH={16:"d",26:"d",47:"d",15:"p",46:"p",36:"p",28:"m",38:"m",48:"m"};
  var UPPER=[18,17,16,15,14,13,12,11,21,22,23,24,25,26,27,28],LOWER=[48,47,46,45,44,43,42,41,31,32,33,34,35,36,37,38];
  var MEMO=[
    {w:"Одразу",x:"Тампон тримайте щільно прикушеним 30–40 хвилин. Найближчу годину не полощіть рот."},
    {w:"Одразу",x:"Холод до щоки зовні: 20 хвилин прикласти, 20 — перерва, протягом першої доби."},
    {w:"Перші 2 години",x:"Нічого гарячого. Сьогодні й завтра — мʼяка їжа кімнатної температури. Через соломинку не пийте."},
    {w:"Наступного дня",x:"Обережне полоскання теплим сольовим розчином після їжі, без активних рухів."},
    {w:"Через 2 дні",x:"Набряк і синець на 2–3 день — це нормально, а не ускладнення. Далі стає легше."},
    {w:"Через 3 дні",x:"Тримайтесь мʼякої їжі ще кілька днів, поки жувати не стане комфортно."},
    {w:"Через тиждень",x:"Прийдіть на контроль і, якщо накладали шви, — на їх зняття."}
  ];
  var MEMO_DONE=[true,true,true,true,true,false,false];
  var HEAD={home:["Кабінет пацієнта",""],plan:["Лікування","План і зубна формула"],care:["Догляд","Памʼятки, гарантії, огляди"],
    clinic:["Клініка","Години, лікарі, прайс"],profile:["Профіль","Дані, згоди, пристрої"],book:["Запис на прийом","Лікар і вільний час"],loyalty:["Бали","Рахунок і запрошення"]};

  var S={tab:"home",doc:null,slot:null,note:"",booked:null,accepted:null,memo:MEMO_DONE.slice(),careTab:"memo"};
  var app=document.getElementById("app");

  function load(){try{var v=JSON.parse(localStorage.getItem("im-clinic-proto")||"null");if(v){S.booked=v.booked||null;S.accepted=v.accepted||null;if(v.memo&&v.memo.length===MEMO.length)S.memo=v.memo}}catch(e){}}
  function save(){try{localStorage.setItem("im-clinic-proto",JSON.stringify({booked:S.booked,accepted:S.accepted,memo:S.memo}))}catch(e){}}

  function days(){var a=[],n=new Date();for(var i=1;a.length<5;i++){var d=new Date(n.getFullYear(),n.getMonth(),n.getDate()+i);if(d.getDay()!==0)a.push(d)}return a}
  function dm(d){return d.getDate()+" "+MON[d.getMonth()]}
  function short(d){return d.getDate()+"."+String(d.getMonth()+1).padStart(2,"0")}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
  function docById(id){return DOCTORS.filter(function(x){return x.id===id})[0]}
  /* Детерміновано «зайняті» слоти, щоб кожен день виглядав по-різному */
  function free(docId,d){return TIMES.filter(function(t,i){return (i*7+d.getDate()*3+docId*5)%4!==0})}
  function memoLeft(){return S.memo.filter(function(x){return !x}).length}

  function head(){var h=HEAD[S.tab];return '<header class="top"><img class="logo" src="logo.png" alt="Логотип клініки"><div><b>'+h[0]+'</b>'+(h[1]?'<span>'+h[1]+'</span>':'')+'</div></header><div class="demo-band">Демо: дані вигадані</div>'}
  function kv(k,v){return '<div class="kv"><span>'+k+'</span><span>'+v+'</span></div>'}
  function link(go,title,sub){return '<button class="card row quick" data-go="'+go+'"><div class="grow"><b>'+title+'</b><div class="muted">'+sub+'</div></div><span class="chev">›</span></button>'}

  function home(){
    var h='<div class="pad">';
    if(S.booked){
      var b=S.booked;
      h+='<div class="card"><div class="big tab">'+esc(b.short)+' · '+esc(b.time)+'</div><h3 style="margin:8px 0 6px">Найближчий візит</h3>'+kv("Триває","30 хв")+kv("Лікар",esc(b.doc))+(b.note?kv("Привід",esc(b.note)):"")+'</div>';
      h+='<h3>Нагадування</h3><div class="card"><b>Телефон нагадає за 24 і за 2 години</b><div class="muted">Push від клініки — без медичних подробиць</div></div>';
    } else {
      h+='<div class="card"><h3 style="margin-top:0">Найближчий візит</h3><div class="big">Немає запису</div><p class="muted" style="margin:6px 0 12px">Оберіть лікаря й вільний час</p><button class="btn" data-go="book">Записатися на прийом</button></div>';
    }
    h+='<h3>Догляд після процедури</h3><button class="card row quick" data-go="care"><div class="grow"><b>Після видалення зуба мудрості</b><div class="muted">4 жовтня · '+(memoLeft()?'Лишились кроки догляду':'Усі кроки виконано')+'</div></div><b class="tab">'+(MEMO.length-memoLeft())+'/'+MEMO.length+'</b></button>';
    h+='<h3>Швидкі входи</h3>';
    h+=link("plan","План лікування",S.accepted?"Погоджено":"Очікує вашого погодження");
    h+=link("loyalty","Бали й запрошення","2 450 балів · Gold");
    h+=link("book","Записатися на прийом","Лікар і вільний час");
    h+='<a class="card row quick" href="tel:'+CLINIC.tel+'"><div class="grow"><b>Зателефонувати в клініку</b><div class="muted tab">'+CLINIC.phone+'</div></div><span class="chev">›</span></a>';
    return h+'</div>';
  }

  function book(){
    var h='<div class="pad">';
    if(S.booked&&S.booked.fresh){
      var b=S.booked;
      return h+'<div class="done"><div class="check">✓</div><h1>Ви записані</h1><p class="sub">'+esc(b.date)+', '+esc(b.time)+'<br>'+esc(b.doc)+'<br>Телефон нагадає за 24 і за 2 години</p><button class="btn" data-go="home">На головну</button></div></div>';
    }
    if(!S.doc){
      h+='<h3 style="margin-top:0">Оберіть лікаря</h3>';
      DOCTORS.forEach(function(d){h+='<button class="card doc row" data-doc="'+d.id+'"><div class="grow"><b>'+d.name+'</b><div class="muted">'+d.role+'</div></div><span class="chev">›</span></button>'});
      return h+'</div>';
    }
    var doc=docById(S.doc);
    if(!S.slot){
      h+='<div class="row" style="margin-bottom:6px"><div class="grow"><b>'+doc.name+'</b><div class="muted">'+doc.role+'</div></div><button class="link" style="margin:0" data-change>Змінити</button></div>';
      days().forEach(function(d,i){
        h+='<h3>'+dm(d)+'</h3><div class="slots">';
        free(S.doc,d).forEach(function(t){h+='<button class="slot tab" data-slot="'+i+'|'+t+'">'+t+'</button>'});
        h+='</div>';
      });
      return h+'</div>';
    }
    var sd=days()[S.slot.day];
    h+='<h3 style="margin-top:0">Перевірте запис</h3><div class="card">'+kv("Лікар",doc.name+'<div class="muted">'+doc.role+'</div>')+kv("Дата",dm(sd)+' '+sd.getFullYear()+' р.')+kv("Час",'<span class="tab">'+S.slot.time+' · 30 хв</span>')+'</div>';
    h+='<label class="muted" for="note">Що турбує (необовʼязково)</label><textarea id="note" placeholder="Наприклад: болить зуб праворуч знизу">'+esc(S.note)+'</textarea>';
    h+='<button class="btn" data-confirm>Підтвердити запис</button><button class="link" data-reslot>Обрати інший час</button>';
    return h+'</div>';
  }

  function plan(){
    var h='<div class="pad"><h1>План лікування</h1><p class="sub">Литвиненко Марія Олександрівна</p>';
    h+='<div class="card"><h3 style="margin-top:0">Залишок до сплати</h3><div class="big tab">40 650 <small style="font-size:18px">₴</small></div><p class="muted" style="margin-top:6px">Сплачено <b class="tab">9 000</b> з <span class="tab">49 650</span> ₴</p>';
    h+='<div class="segbar">'+new Array(21).join("x").split("").map(function(_,i){return '<i class="'+(i<4?'on':'')+'"></i>'}).join("")+'</div><div class="row muted" style="font-size:11px;letter-spacing:.1em"><span class="grow">ВИКОНАНО 18 %</span><span>ЕТАП 2 з 4</span></div></div>';
    h+='<h3>Зубна формула</h3><div class="film">';
    [UPPER,LOWER].forEach(function(row){h+='<div class="jaw">';row.forEach(function(n){h+='<div class="t '+(TEETH[n]||"")+'" title="Зуб '+n+'">'+n+'</div>'});h+='</div>'});
    h+='</div><div class="legend"><span>┅ Заплановано <b>3</b></span><span>■ Проліковано <b>3</b></span><span>▫ Відсутній <b>3</b></span><span>□ Здоровий <b>23</b></span></div>';
    h+='<h3>Етапи плану</h3>';
    STAGES.forEach(function(s,i){
      h+='<div class="card"><div class="stage"><div class="n '+s.st+'">'+(s.st==="d"?"✓":i+1)+'</div><div class="grow"><b>'+s.t+'</b><div class="muted">'+s.v+'</div>'+(s.st==="d"?'<span class="pill ok" style="margin-top:6px">Завершено · '+s.c+'</span>':s.st==="c"?'<span class="pill" style="margin-top:6px">Поточний · '+s.c+'</span>':'<span class="muted" style="font-size:12px">'+s.c+'</span>')+'</div><div class="price tab">'+s.p+' ₴</div></div>';
      if(s.why)h+='<h3>Навіщо</h3><p style="font-size:14px">'+s.why+'</p><h3>Результат</h3><p style="font-size:14px">'+s.res+'</p>';
      h+='</div>';
    });
    h+='<div class="warn"><b>Що буде, якщо чекати</b>';
    WARNINGS.forEach(function(w){h+='<p><b style="color:var(--ink)">'+w[0]+'.</b> '+w[1]+'</p>'});
    h+='</div><div class="card row"><div class="grow"><h3 style="margin:0 0 4px">Розстрочка</h3><b class="tab" style="font-size:20px">4 137,50 ₴ / міс</b></div><span class="muted">12 місяців</span></div>';
    if(S.accepted) h+='<div class="accepted">✓ Ви погодили цей план · '+esc(S.accepted)+'</div>';
    else h+='<p class="muted" style="margin:6px 0 12px">Анно Сергіївно, найважча частина вже позаду. Те, що лишилось, — планові й спокійні кроки: спершу дві пломби, потім імплант і коронки.</p><button class="btn" data-accept>Погодити план</button>';
    return h+'</div>';
  }

  function care(){
    var h='<div class="pad"><div class="seg">'+[["memo","Памʼятки"],["war","Гарантії"],["rec","Огляди"]].map(function(t){return '<button class="'+(S.careTab===t[0]?'on':'')+'" data-care="'+t[0]+'">'+t[1]+'</button>'}).join("")+'</div>';
    if(S.careTab==="war") return h+'<h3>Чинна гарантія клініки</h3><div class="card">'+kv("Що покрито","Коронка керамічна (оксид цирконію) · зуб 47")+kv("Діє до","1 вересня 2027 р.")+'<p class="muted" style="margin-top:8px">Якщо коронка сколеться або розцементується без травми — замінимо безкоштовно.</p></div></div>';
    if(S.careTab==="rec") return h+'<div class="card"><div class="big">8 грудня</div><h3 style="margin:8px 0 6px">Наступний огляд</h3><b>Час на огляд</b><p class="muted" style="margin-top:4px">Клініка ставить строк через 6 місяців після процедури. Записатись можна в застосунку або телефоном.</p><button class="btn" style="margin-top:12px" data-go="book">Записатися на прийом</button></div></div>';
    h+='<h1>Після видалення зуба мудрості</h1><p class="sub">Видано 4 жовтня 2026 р.</p>';
    h+='<div class="row" style="margin-bottom:12px"><div class="big tab">'+memoLeft()+'</div><div class="grow muted">кроки догляду лишились<br>Виконано '+(MEMO.length-memoLeft())+' з '+MEMO.length+'</div></div><div class="tl">';
    MEMO.forEach(function(m,i){h+='<div class="item card'+(S.memo[i]?' on':'')+'"><button class="tick'+(S.memo[i]?' on':'')+'" data-memo="'+i+'" aria-pressed="'+S.memo[i]+'"><span class="box">'+(S.memo[i]?'✓':'')+'</span><span class="grow"><span class="pill">'+m.w+'</span><span class="txt" style="display:block;margin-top:4px;font-size:14px">'+m.x+'</span></span></button></div>'});
    h+='</div><div class="card urgent"><b>Коли дзвонити терміново</b><p class="muted" style="margin-top:4px">Це не список справ — це ознаки, за яких не треба чекати планового візиту.</p><ul><li>Кровотеча не зменшується після 2 годин щільного прикусу тампона.</li><li>Температура вище 38 °C або біль росте на 3–4 день.</li><li>Оніміння губи, підборіддя чи язика не минає.</li></ul><a class="btn sec" style="margin-top:12px" href="tel:'+CLINIC.tel+'">'+CLINIC.phone+'</a></div>';
    return h+'</div>';
  }

  function clinic(){
    var h='<div class="pad"><div class="card"><div class="big">Відчинено</div><p class="muted" style="margin:4px 0 12px">до 20:00</p><a class="btn sec" href="tel:'+CLINIC.tel+'">'+CLINIC.phone+'</a><button class="btn" style="margin-top:8px" data-go="book">Записатися на прийом</button></div>';
    h+='<div class="card">'+kv("Адреса",CLINIC.address)+kv("Пн–Пт","9:00–20:00")+kv("Сб–Нд","10:00–18:00")+'</div>';
    h+='<h3>Напрями</h3><p class="muted">Терапевтична стоматологія · Ендодонтія · Ортодонтія · Протезування · Імплантація · Хірургія · Ортопедія</p>';
    h+='<h3>Лікарі</h3>';
    DOCTORS.forEach(function(d){h+='<div class="card"><b>'+d.name+'</b><div class="muted">'+d.role+'</div></div>'});
    return h+'<h3>Прайс</h3><p class="muted">Ціни орієнтовні: остаточну суму лікар називає після огляду. Ваші власні позиції з цінами — у плані лікування.</p></div>';
  }

  function loyalty(){
    return '<div class="pad"><div class="card"><h3 style="margin-top:0">На вашому рахунку</h3><div class="big tab">2 450 балів</div><p class="muted" style="margin-top:6px">1 бал — це 1 гривня. Скажіть на рецепції, що хочете оплатити балами частину візиту.</p></div>'+
      '<div class="card"><h3 style="margin-top:0">Ваш рівень</h3><b style="font-size:20px">Gold</b><p class="muted">Знижка рівня — 5 % на лікування. До Platinum лишилось 28 200 грн лікування за рік.</p></div>'+
      '<div class="card"><h3 style="margin-top:0">Запросіть близьких</h3><p class="muted">Коли людина за вашим кодом прийде на перший візит, вам нарахується 300 балів.</p><div class="big tab" style="margin-top:8px;letter-spacing:.1em">9FZME5</div></div></div>';
  }

  function profile(){
    var h='<div class="pad"><h3 style="margin-top:0">Ваші дані</h3><div class="card">'+kv("Пацієнт","Коваль Анна Сергіївна")+kv("Телефон",'<span class="tab">+380 67 000 01 01</span>')+kv("Дата народження","21 липня 1992 р.")+'<p class="muted" style="margin-top:8px">Дані веде клініка — щоб змінити, скажіть на рецепції.</p></div>';
    h+='<h3>Акції</h3><div class="card"><p class="muted">Нагадування про візит і догляд від згоди на акції не залежать.</p></div>';
    h+='<h3>Родина</h3><div class="card row"><div class="grow"><b>Коваль Софія</b><div class="muted">донька</div></div><span class="chev">›</span></div>';
    h+='<h3>Пристрої</h3><div class="card row"><div class="grow"><b>Цей пристрій</b><div class="muted">Підключено сьогодні</div></div></div>';
    h+='<h3>Про застосунок</h3><div class="card">'+kv("Застосунок",CLINIC.app)+kv("Організація",CLINIC.name)+kv("Створено","im.pl.ua")+'</div></div>';
    return h;
  }

  var VIEWS={home:home,book:book,plan:plan,care:care,clinic:clinic,profile:profile,loyalty:loyalty};
  var TAB_OF={book:"home",loyalty:"home"};
  function render(keep){
    var y=app.scrollTop;
    app.innerHTML=head()+VIEWS[S.tab]();app.scrollTop=keep?y:0;
    var on=TAB_OF[S.tab]||S.tab;
    Array.prototype.forEach.call(document.querySelectorAll("#tabs button"),function(b){b.classList.toggle("on",b.dataset.tab===on)});
  }
  function goTab(t){if(t==="book")resetBook();if(t!=="book"&&S.booked)S.booked.fresh=false;S.tab=t;render()}
  function resetBook(){S.doc=null;S.slot=null;S.note="";if(S.booked)S.booked.fresh=false}

  document.getElementById("tabs").addEventListener("click",function(e){var b=e.target.closest("button");if(b)goTab(b.dataset.tab)});
  app.addEventListener("input",function(e){if(e.target.id==="note")S.note=e.target.value});
  app.addEventListener("click",function(e){
    var t=e.target.closest("button");if(!t)return;
    if(t.dataset.go){goTab(t.dataset.go);return}
    if(t.dataset.doc){S.doc=+t.dataset.doc;render();return}
    if("change" in t.dataset){S.doc=null;render();return}
    if(t.dataset.slot){var p=t.dataset.slot.split("|");S.slot={day:+p[0],time:p[1]};render();return}
    if("reslot" in t.dataset){S.slot=null;render();return}
    if(t.dataset.care){S.careTab=t.dataset.care;render();return}
    if(t.dataset.memo){var i=+t.dataset.memo;S.memo[i]=!S.memo[i];save();render(true);return}
    if("accept" in t.dataset){var n=new Date();S.accepted=dm(n)+" "+n.getFullYear()+" р.";save();render(true);return}
    if("confirm" in t.dataset){
      var doc=docById(S.doc),d=days()[S.slot.day];
      S.booked={doc:doc.name,time:S.slot.time,date:dm(d),short:short(d),note:S.note.trim(),fresh:true};save();render();
    }
  });

  /* Тексти пушів — як у застосунку: без медичних даних, бо їх видно на заблокованому екрані. */
  var pushEl=document.getElementById("push"),pushTimer;
  function showPush(){
    var b=S.booked;
    document.getElementById("push-title").textContent=b?"Завтра візит":"Памʼятка після візиту";
    document.getElementById("push-text").textContent=b?"Чекаємо на вас завтра. Якщо плани змінились — скасуйте чи перенесіть у застосунку.":"Що можна і чого не варто сьогодні — у розділі «Догляд».";
    pushEl.classList.add("show");clearTimeout(pushTimer);pushTimer=setTimeout(function(){pushEl.classList.remove("show")},4500);
  }
  function resetAll(){S.booked=null;S.accepted=null;S.memo=MEMO_DONE.slice();S.careTab="memo";resetBook();S.tab="home";try{localStorage.removeItem("im-clinic-proto")}catch(e){}pushEl.classList.remove("show");render()}
  document.getElementById("d-push").onclick=showPush;
  document.getElementById("d-reset").onclick=resetAll;
  pushEl.onclick=function(){pushEl.classList.remove("show");goTab(S.booked?"home":"care")};
  document.addEventListener("keydown",function(e){if(e.target.tagName==="TEXTAREA"||e.target.tagName==="INPUT")return;if(e.key==="n"||e.key==="N")showPush();if(e.key==="r"||e.key==="R")resetAll()});

  if(location.hash==="#rec")document.documentElement.classList.add("rec");
  load();render();
})();
</script>
</body>
</html>
